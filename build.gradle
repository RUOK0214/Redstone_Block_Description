plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
loom {
    splitEnvironmentSourceSets()
    mods { 'redstone_help' { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'redstone_help_test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
tasks.named('runClientGameTest') {
    if (project.hasProperty('auditCatalog')) jvmArgs '-Dredstone_help.audit=true'
    if (project.hasProperty('captureIllustrations')) {
        jvmArgs '-Dredstone_help.capture=true'
        if (project.hasProperty('capturePreview')) jvmArgs '-Dredstone_help.capturePreview=true'
        if (project.hasProperty('captureRevised')) jvmArgs '-Dredstone_help.captureRevised=true'
        if (project.hasProperty('captureExpanded')) jvmArgs '-Dredstone_help.captureExpanded=true'
    }
}
